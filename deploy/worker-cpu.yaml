# Ajuste a imagem e crie tap-runtime (mesmo Secret da API).
# O worker usa Deployment: não depende de requisições HTTP para continuar ativo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-to-text-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-to-text-worker
  template:
    metadata:
      labels:
        app: audio-to-text-worker
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: worker
          image: image-registry.example.com/<namespace>/audio-to-text:cpu
          command: ["python", "-m", "worker"]
          envFrom:
            - secretRef:
                name: tap-runtime
          env:
            - name: WHISPER_DEVICE
              value: cpu
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
