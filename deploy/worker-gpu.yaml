# Alternativa ao worker CPU; requer NVIDIA device plugin e imagem Dockerfile.gpu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-to-text-worker-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-to-text-worker-gpu
  template:
    metadata:
      labels:
        app: audio-to-text-worker-gpu
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: worker
          image: image-registry.example.com/<namespace>/audio-to-text:gpu
          command: ["python", "-m", "worker"]
          envFrom:
            - secretRef:
                name: tap-runtime
          env:
            - name: WHISPER_DEVICE
              value: cuda
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
