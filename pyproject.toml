[project]
name = "audio-to-text"
version = "0.2.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.115.0",
    "pyannote-audio>=3.1.0",
    "python-dotenv>=1.0.0",
    "torch>=2.6.0",
    "uvicorn[standard]>=0.32.0",
    "minio>=7.2.20",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
addopts = "--cov=server --cov=transcribe --cov=storage --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
