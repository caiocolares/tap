[project]
name = "audio-to-text"
version = "0.2.0"
description = "Audio transcription and speaker diarization through a CLI and FastAPI service"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.115.0",
    "pyannote-audio>=3.1.0",
    "python-dotenv>=1.0.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "uvicorn[standard]>=0.32.0",
    "minio>=7.2.20",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    {include-group = "test"},
    "ruff>=0.14.0",
]
api = [
    "fastapi>=0.115.0",
    "minio>=7.2.20",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
]
test = [
    {include-group = "api"},
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
addopts = "--cov=server --cov=transcribe --cov=storage --cov=settings --cov=jobs --cov=worker --cov=processing --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: smoke tests using locally installed external tools"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
