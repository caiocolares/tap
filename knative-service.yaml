# API leve. Requer PostgreSQL e S3/MinIO externos e ao menos um worker ativo.
# Crie o Secret tap-runtime com JOBS_DATABASE_URL, MINIO_ENDPOINT,
# MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET, MINIO_SECURE e HF_TOKEN
# (HF_TOKEN opcional; use a mesma configuração nos workers).
# Publique Dockerfile.api e ajuste a imagem antes de aplicar.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: audio-to-text
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 8
      timeoutSeconds: 600
      containers:
        - image: image-registry.example.com/<namespace>/audio-to-text:api
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tap-runtime
          env:
            - name: API_ASYNC_ONLY
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
