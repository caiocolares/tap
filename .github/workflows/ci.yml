# Lint e testes Python. As verificações de segurança estão em seguranca.yml.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tap_test
          POSTGRES_PASSWORD: tap_test
          POSTGRES_DB: tap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tap_test -d tap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true

      - name: Instalar Python e dependências de desenvolvimento
        run: |
          uv python install 3.13
          uv sync --locked --only-group dev

      - name: Verificar estilo
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Preparar MinIO de integração
        run: |
          docker build -f Dockerfile.minio -t tap-minio-ci .
          docker run -d --name tap-minio-ci -p 9000:9000 \
            -e MINIO_ROOT_USER=tap_test -e MINIO_ROOT_PASSWORD=tap_test_secret tap-minio-ci
          for attempt in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs tap-minio-ci
          exit 1

      - name: Validar imagem leve da API
        run: |
          docker build -f Dockerfile.api -t tap-api-ci .
          docker run --rm --entrypoint python tap-api-ci -c \
            "import importlib.util; import server; assert server._settings.api_async_only; assert importlib.util.find_spec('torch') is None"

      - name: Executar testes
        env:
          PYTHON_DOTENV_DISABLED: "1"
          TAP_TEST_DATABASE_URL: postgresql://tap_test:tap_test@localhost:5432/tap_test
          TAP_TEST_MINIO_ENDPOINT: localhost:9000
          TAP_TEST_MINIO_ACCESS_KEY: tap_test
          TAP_TEST_MINIO_SECRET_KEY: tap_test_secret
        run: uv run --no-sync pytest --cov-report=xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  # A mensagem de commit é contrato de leitura do histórico, e o sign-off do DCO
  # é o instrumento de titularidade da contribuição (CONTRIBUTING.md).
  commits:
    name: Commits (Conventional Commits + sign-off DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar mensagens e sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          padrao='^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\([a-z0-9._-]+\))?!?: .+'
          falhou=0
          while read -r sha; do
              assunto=$(git log -1 --format=%s "$sha")
              corpo=$(git log -1 --format=%B "$sha")
              if ! printf '%s' "$assunto" | grep -Eq "$padrao"; then
                  echo "::error::Mensagem fora do padrão Conventional Commits em ${sha:0:8}: $assunto"
                  falhou=1
              fi
              if ! printf '%s' "$corpo" | grep -q '^Signed-off-by: .\+ <.\+@.\+>'; then
                  echo "::error::Commit ${sha:0:8} sem sign-off do DCO. Use: git commit -s (ou git rebase --signoff origin/main)"
                  falhou=1
              fi
          done < <(git rev-list "$BASE".."$HEAD")
          exit $falhou
