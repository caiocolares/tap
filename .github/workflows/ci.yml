      # - run: ./gradlew --no-daemon build

      - name: Placeholder
        run: |
          echo "::error::Configure a stack deste projeto em .github/workflows/ci.yml"
          exit 1

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  # A mensagem de commit é contrato de leitura do histórico, e o sign-off do DCO
  # é o instrumento de titularidade da contribuição (CONTRIBUTING.md).
  commits:
    name: Commits (Conventional Commits + sign-off DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar mensagens e sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          padrao='^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\([a-z0-9._-]+\))?!?: .+'
          falhou=0
          while read -r sha; do
              assunto=$(git log -1 --format=%s "$sha")
              corpo=$(git log -1 --format=%B "$sha")
              if ! printf '%s' "$assunto" | grep -Eq "$padrao"; then
                  echo "::error::Mensagem fora do padrão Conventional Commits em ${sha:0:8}: $assunto"
                  falhou=1
              fi
              if ! printf '%s' "$corpo" | grep -q '^Signed-off-by: .\+ <.\+@.\+>'; then
                  echo "::error::Commit ${sha:0:8} sem sign-off do DCO. Use: git commit -s (ou git rebase --signoff origin/main)"
                  falhou=1
              fi
          done < <(git rev-list "$BASE".."$HEAD")
          exit $falhou
