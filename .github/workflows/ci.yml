# Esteira de build e teste. Este arquivo é um esqueleto: descomente o bloco da
# stack do projeto e apague os outros. O que NÃO é opcional está em
# seguranca.yml (segredos, dependências e SBOM — axioma de §8.3).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ------------------------------------------------------------------ #
      # Python                                                             #
      # ------------------------------------------------------------------ #
      # - uses: actions/setup-python@v5
      #   with:
