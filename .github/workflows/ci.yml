      # ------------------------------------------------------------------ #
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: npm
      # - run: npm ci
      # - run: npm run lint
      # - run: npm test -- --coverage

      # ------------------------------------------------------------------ #
      # JVM (Kotlin / Java, Gradle)                                        #
      # ------------------------------------------------------------------ #
      # - uses: actions/setup-java@v4
      #   with:
      #     distribution: temurin
      #     java-version: "21"
